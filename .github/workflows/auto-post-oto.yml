name: Auto Oto

on:
  schedule:
    - cron: '33 */6 * * *'    # tiap 6 jam
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Jalankan skrip auto-post oto
        run: node auto-post-oto.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          KATEGORI_OTO_ID: ${{ secrets.KATEGORI_OTO_ID }}
          POST_STATUS_OTO: publish
          MAKS_OTO_PER_PROSES: '1'
          AMBIL_ARTIKEL_LENGKAP: 'true'
          SERTAKAN_FOTO: 'true'
          SISIPKAN_FOTO_DI_ARTIKEL: 'false'
          SERTAKAN_RINGKASAN: 'false'
          MODE_ATRIBUSI_SUMBER: 'teks'
          SERTAKAN_TAG_OTOMATIS: 'true'

      - name: Simpan riwayat posting oto
        run: |
          git config user.name "auto-post-bot"
          git config user.email "auto-post-bot@users.noreply.github.com"
          git add posted-oto-log.json
          git diff --staged --quiet || git commit -m "Update posted-oto-log.json"
          git push
