name: Auto Sport

on:
  schedule:
    - cron: '51 */5 * * *'   # tiap 5 jam sekali run
  workflow_dispatch: {}       # supaya bisa dijalankan manual dari tab Actions

permissions:
  contents: write             # supaya bisa commit balik posted-log.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'         # mempercepat proses & menghemat kuota menit
                                # (butuh package-lock.json ikut ada di repo — lihat Bagian C.3 panduan)

      - name: Install dependencies
        run: npm install

      - name: Jalankan skrip auto-post sport
        run: node auto-post-sport.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          KATEGORI_SPORT_ID: ${{ secrets.KATEGORI_SPORT_ID }}
          POST_STATUS_SPORT: publish
          MAKS_SPORT_PER_PROSES: '1'
          AMBIL_ARTIKEL_LENGKAP: 'true'
          SERTAKAN_FOTO: 'true'
          MINIMAL_LEBAR_GAMBAR: '800'
          MODE_ATRIBUSI_SUMBER: 'teks'
          SISIPKAN_FOTO_DI_ARTIKEL: 'false'
          SERTAKAN_RINGKASAN: 'false'
          SERTAKAN_TAG_OTOMATIS: 'true'

      - name: Simpan riwayat posting sport
        run: |
          git config user.name "auto-post-bot"
          git config user.email "auto-post-bot@users.noreply.github.com"
          git add posted-sport-log.json
          git diff --staged --quiet || git commit -m "Update posted-sport-log.json"
          git push
